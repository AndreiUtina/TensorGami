[project]
name = "tensorgami"
version = "0.1.0"
description = "Draw the architecture and information flow of deep-learning / machine-learning models"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]
docs = [
    "matplotlib>=3.9",
    "typst>=0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tensorgami"]

[tool.uv]
default-groups = ["dev", "docs"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
