[project]
name = "tensorgami"
dynamic = ["version", "readme"]  # version: src/tensorgami/__init__.py; readme: README.md, below
description = "Draw the architecture and information flow of PyTorch models: figures for papers, reports and slides"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Andrei Utina" }]
keywords = [
    "pytorch", "neural network", "architecture", "diagram", "visualization", "deep learning",
    "figure", "matplotlib",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Jupyter",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Multimedia :: Graphics :: Presentation",
]
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.7",  # figures, PNG, Jupyter display (ADR-0005); the only runtime dependency
]

[project.optional-dependencies]
torch = ["torch>=2.2"]  # never a hard dependency: users keep their own CPU/CUDA build (ADR-0006)

[project.urls]
Homepage = "https://github.com/AndreiUtina/TensorGami"
Repository = "https://github.com/AndreiUtina/TensorGami"
Issues = "https://github.com/AndreiUtina/TensorGami/issues"
Changelog = "https://github.com/AndreiUtina/TensorGami/blob/main/CHANGELOG.md"
Gallery = "https://github.com/AndreiUtina/TensorGami/blob/main/docs/gallery/README.md"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]
docs = [
    "typst>=0.12",
]
torch = [
    # the newest torch with Intel-Mac wheels is 2.2.2, which needs numpy < 2 (ADR-0006)
    "torch==2.2.2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "numpy<2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "torch>=2.2; sys_platform != 'darwin' or platform_machine != 'x86_64'",
]

[build-system]
requires = ["hatchling", "hatch-fancy-pypi-readme>=24"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/tensorgami/__init__.py"

# README.md links to the repository's files by relative paths, which GitHub resolves in a
# private repository and on every branch; on PyPI they become absolute (images: the raw files)
[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '(!\[[^\]]*\]\()(?!https?://)([^)\s]+)\)'
replacement = '\1https://raw.githubusercontent.com/AndreiUtina/TensorGami/main/\2)'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '(\]\()(?!https?://|#)([^)\s]+)\)'
replacement = '\1https://github.com/AndreiUtina/TensorGami/blob/main/\2)'

[tool.hatch.build.targets.wheel]
packages = ["src/tensorgami"]

[tool.hatch.build.targets.sdist]  # the package and what describes it; docs and examples stay on GitHub
include = [
    "/src/tensorgami",
    "/README.md",
    "/LICENSE",
    "/THIRD_PARTY_NOTICES.md",
    "/CHANGELOG.md",
    "/CITATION.cff",
    "/pyproject.toml",
]

[tool.uv]
default-groups = ["dev", "docs", "torch"]
environments = ["sys_platform == 'darwin'", "sys_platform == 'linux'"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]  # no CUDA in dev/CI

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.format]
exclude = ["*.md", "docs/survey/*"]  # prose code blocks and the survey's build scripts stay as written
