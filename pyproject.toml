[project]
name = "tensorgami"
version = "0.1.0"
description = "Draw the architecture and information flow of deep-learning / machine-learning models"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
torch = ["torch>=2.2"]  # never a hard dependency: users keep their own CPU/CUDA build (ADR-0006)

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]
docs = [
    "matplotlib>=3.9",
    "typst>=0.12",
]
torch = [
    # the newest torch with Intel-Mac wheels is 2.2.2, which needs numpy < 2 (ADR-0006)
    "torch==2.2.2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "numpy<2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "torch>=2.2; sys_platform != 'darwin' or platform_machine != 'x86_64'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tensorgami"]

[tool.uv]
default-groups = ["dev", "docs", "torch"]
environments = ["sys_platform == 'darwin'", "sys_platform == 'linux'"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]  # no CUDA in dev/CI

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
